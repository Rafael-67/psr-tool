<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSR Biosafety Assessment Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f0;--bg3:#eeedfe;--text:#222;--text2:#666;--text3:#999;--border:#ddd;--accent:#534ab7;--accent-bg:#eeedfe;--green-bg:#eaf3de;--green-text:#3b6d11;--amber-bg:#faeeda;--amber-text:#854f0b;--red-bg:#fcebeb;--red-text:#a32d2d;--blue-bg:#e6f1fb;--blue-text:#0c447c;--purple-bg:#eeedfe;--purple-text:#3c3489;--teal-bg:#e1f5ee;--teal-text:#085041;--radius:8px;--radius-lg:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#2a2a28;--bg3:#2d2b3d;--text:#e0ddd4;--text2:#a0a098;--text3:#706f6a;--border:#3a3a38;--accent:#afa9ec;--accent-bg:#2d2b3d;--green-bg:#1a2a10;--green-text:#97c459;--amber-bg:#2a1f08;--amber-text:#f0c060;--red-bg:#2a1010;--red-text:#f09595;--blue-bg:#0a1a2a;--blue-text:#85b7eb;--purple-bg:#2d2b3d;--purple-text:#cecbf6;--teal-bg:#0a2a20;--teal-text:#5dcaa5}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:22px;font-weight:600}
h2{font-size:17px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:16px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:16px}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
.pill-green{background:var(--green-bg);color:var(--green-text)}
.pill-amber{background:var(--amber-bg);color:var(--amber-text)}
.pill-red{background:var(--red-bg);color:var(--red-text)}
.pill-blue{background:var(--blue-bg);color:var(--blue-text)}
.pill-purple{background:var(--purple-bg);color:var(--purple-text)}
.pill-teal{background:var(--teal-bg);color:var(--teal-text)}
.pill-gray{background:var(--bg2);color:var(--text2)}
.steps-bar{display:flex;gap:4px;align-items:center;margin:16px 0}
.step-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;transition:all .2s}
.step-dot.done{background:#1d9e75;color:#fff}
.step-dot.active{background:var(--accent);color:#fff}
.step-dot.pending{background:var(--bg2);color:var(--text3)}
.step-line{flex:1;height:2px;border-radius:1px;transition:background .2s}
.step-line.done{background:#9fe1cb}
.step-line.pending{background:var(--border)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:4px 10px;border-radius:6px;font-size:11px;border:none;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s}
.tab.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.opt-grid{display:grid;gap:8px}
.opt-grid.c2{grid-template-columns:1fr 1fr}
.opt-grid.c3{grid-template-columns:1fr 1fr 1fr}
.opt{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;text-align:left;font-size:13px;background:transparent;color:var(--text);transition:all .15s}
.opt.selected{border:2px solid var(--accent);background:var(--accent-bg)}
.opt-label{font-weight:500}
.opt-desc{font-size:11px;color:var(--text2);margin-top:2px}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border-radius:var(--radius);border:1px solid var(--border);font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
.field{margin-bottom:14px}
.field-label{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.check-label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:6px 10px;border-radius:6px;background:var(--bg2)}
.note{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-top:12px}
.note-purple{background:var(--purple-bg);color:var(--purple-text)}
.note-amber{background:var(--amber-bg);color:var(--amber-text)}
.note-red{background:var(--red-bg);color:var(--red-text)}
.note-teal{background:var(--teal-bg);color:var(--teal-text)}
.proc-block{padding:16px;background:var(--bg2);border-radius:var(--radius);margin-bottom:12px}
.nav{display:flex;justify-content:space-between;margin-top:16px}
.btn{padding:10px 20px;border-radius:var(--radius);font-size:14px;cursor:pointer;border:none;transition:all .15s}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;font-weight:500}
.btn-primary:disabled{background:var(--border);color:var(--text3);cursor:default}
.btn-export{background:#1d9e75;color:#fff;font-weight:500;width:100%;margin-top:16px;padding:14px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.summary-grid .lbl{color:var(--text2)}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th,.matrix td{padding:10px 8px;border-bottom:1px solid var(--border)}
.matrix th{text-align:center;font-weight:500}
.matrix td:first-child{font-weight:500}
.matrix td{text-align:center}
.matrix .active-cell{background:var(--accent-bg);font-weight:600;border:2px solid var(--accent);border-radius:4px}
.mod-row{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.mod-opts{display:flex;gap:6px}
.mod-opt{flex:1;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:11px;text-align:center;border:1px solid var(--border);background:transparent;color:var(--text);transition:all .15s;line-height:1.3}
.mod-opt.selected{border:2px solid var(--accent)}
.mod-opt.sel-fav{background:var(--green-bg)}
.mod-opt.sel-unfav{background:var(--red-bg)}
.metric{flex:1;padding:12px;border-radius:var(--radius);text-align:center;background:var(--bg2)}
.metric-val{font-size:24px;font-weight:500}
.metric-label{font-size:12px;color:var(--text2)}
.lang-toggle{position:fixed;top:12px;right:12px;padding:4px 10px;border-radius:6px;font-size:11px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;z-index:10}
.integration{text-align:center;padding:16px;background:var(--accent-bg);border-radius:var(--radius);margin-top:16px}
.integration .eq{font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.result-big{text-align:center;padding:24px 0}
.result-big .bsl{font-size:36px;font-weight:600}
@media print{.nav,.tabs,.steps-bar,.lang-toggle,.btn-export{display:none}.card{break-inside:avoid;border:1px solid #ccc}}
@media(max-width:600px){.opt-grid.c2,.opt-grid.c3{grid-template-columns:1fr}.mod-row{grid-template-columns:1fr}.mod-opts{margin-top:4px}.summary-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

function loadExample(which){
  const ex={...(which==='s3'?EX_S3:EX_S4),schemaVersion:PSRData.SCHEMA_VERSION,algorithmVersion:PSRData.ALGORITHM_VERSION,dataOrigin:'demonstration'};
  const o=JSON.parse(JSON.stringify(ex));
  ['agentName','geneticMod','justification','triggers','addControls','reviewer'].forEach(k=>{o[k]=L(o[k]);});
  if(Array.isArray(o.procedures))o.procedures=o.procedures.map(pr=>({...pr,name:L(pr.name)}));
  D=o;
  step=0;render();
}

function getProcPSRs(){return D.procedures.map(p=>p.aerosol&&p.volume&&p.concentration?classifyPSR(p.aerosol,p.volume,p.concentration):null)}
function getMaxPSR(){const psrs=getProcPSRs();const ord={Low:0,Moderate:1,High:2};return psrs.reduce((m,p)=>p&&ord[p]>ord[m]?p:m,'Low')}

function getFav(){return PSRCore.evaluateModulatingFactors(D.modFactors).favorableFactorCount}
function getEscalationConsideration(){return PSRCore.evaluateModulatingFactors(D.modFactors).escalationConsideration}
function getBSL(){return PSRCore.assignMatrixBSL({...D,rg3StarApplicable:!!D.rg3StarBasis},getMaxPSR()).matrixBsl||'—'}
function getStep5(){return PSRCore.evaluateStep5({riskGroup:D.riskGroup,psrLevel:getMaxPSR(),modulatingFactors:D.modFactors,severityModification:D.severityModification,effectiveSeverity:D.effectiveSeverity,severityBasis:D.severityBasis,severityBasisOther:D.severityBasisOther,severityJustification:D.severityJustification,severityEvidence:D.severityEvidence,selectedLikelihood:D.selectedLikelihood,likelihoodJustification:D.likelihoodJustification})}
function getDecision(){return PSRCore.evaluateContainmentDecision({agent:{...D,rg3StarApplicable:!!D.rg3StarBasis},psrLevel:getMaxPSR(),escalationConsideration:getEscalationConsideration(),escalationDecision:D.escalationDecision,escalationRationale:D.escalationRationale,finalProposedBsl:D.finalProposedBsl,bslOverrideReason:D.bslOverrideReason,bsl2Conditions:{riskAssessmentDocumented:D.bsl2RiskAssessmentDocumented,institutionalStatus:D.bsl2InstitutionalStatus,enhancedControlsDocumented:D.bsl2EnhancedControlsDocumented,operatorCompetencyDocumented:D.bsl2OperatorCompetencyDocumented}})}
function getEffectiveWorkflowStatus(){const d=getDecision();return d.escalationDecision==='pending_review'?'institutional_review_pending':D.workflowStatus}
function getPausePoints(){const d=getDecision(),s=getStep5();return PSRCore.evaluatePausePoints({riskGroup:D.riskGroup,aerosolUncharacterized:D.procedures.some(p=>p.aerosol==='unknown'),matrixBsl:d.matrixBsl,overallRiskLevel:s.overallRiskLevel})}
function bsl2ConditionsMet(){const d=getDecision();return !d.requiresRg3LowBsl2Conditions||d.rg3LowConditionsMet}

function psrPill(level){const c=level==='Low'?'green':level==='Moderate'?'amber':'red';return`<span class="pill pill-${c}">${level} PSR</span>`}
function bslPill(level){const m={'BSL-1':'green','BSL-1*':'green','BSL-2':'blue','BSL-2**':'blue','BSL-2+':'amber','BSL-2+/BSL-3':'amber','BSL-3':'red','BSL-4':'purple'};return`<span class="pill pill-${m[level]||'gray'}">${level}</span>`}

function render(){
  const subs=[t('step1sub'),t('step2sub'),t('step3sub'),t('step4sub'),t('step5sub'),t('step6sub'),t('step7sub'),t('step8sub')];
  let h=`<h1>${t('title')}</h1><p class="sub">${t('subtitle')}</p><div class="note">${lang==='es'?'PSR es un marco profesional de apoyo a decisiones de bioseguridad. No sustituye la revisión experta, la autorización institucional ni los requisitos regulatorios aplicables. Los umbrales cuantitativos son heurísticas operativas descritas en el marco publicado.':'PSR is a professional biosafety decision-support framework. It does not replace expert biosafety review, institutional authorization, or applicable regulatory requirements. Quantitative thresholds are operational heuristics as described in the published framework.'}</div>`;
  h+=`<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap"><button class="btn btn-outline" style="font-size:11px;padding:5px 12px" onclick="loadExample('s3')">${t('loadEx3')}</button><button class="btn btn-outline" style="font-size:11px;padding:5px 12px" onclick="loadExample('s4')">${t('loadEx4')}</button></div>`;
  
  // Step bar
  h+=`<div class="steps-bar">`;
  for(let i=0;i<8;i++){
    const cls=i<step?'done':i===step?'active':'pending';
    h+=`<div class="step-dot ${cls}" onclick="step=${i};render()" style="cursor:pointer">${i+1}</div>`;
    if(i<7)h+=`<div class="step-line ${i<step?'done':'pending'}"></div>`;
  }
  h+=`</div>`;

  // Tabs
  h+=`<div class="tabs">`;
  t('steps').forEach((s,i)=>{h+=`<button class="tab ${i===step?'active':''}" onclick="step=${i};render()">${s}</button>`});
  h+=`</div>`;

  // Step content
  h+=`<div class="card"><h2>${t('steps')[step]}</h2><p class="sub">${subs[step]}</p>`;
  
  if(step===0) h+=renderStep1();
  else if(step===1) h+=renderStep2();
  else if(step===2) h+=renderStep3();
  else if(step===3) h+=renderStep4();
  else if(step===4) h+=renderStep5();
  else if(step===5) h+=renderStep6();
  else if(step===6) h+=renderStep7();
  else if(step===7) h+=renderStep8();

  h+=`</div>`;

  // Nav
  h+=`<div class="nav">`;
  h+=`<button class="btn btn-outline" onclick="step=Math.max(0,step-1);render()" ${step===0?'disabled':''}>${t('prev')}</button>`;
  h+=`<button class="btn btn-primary" onclick="step=Math.min(7,step+1);render()" ${step===7?'disabled':''}>${step===7?t('complete'):t('next')}</button>`;
  h+=`</div>`;

  document.getElementById('app').innerHTML=h;
  PSRA11y.enhance(document.getElementById('app'),lang);
}

function expectedNumericCategory(v,type){v=Number(v);if(!Number.isFinite(v)||v<0)return null;if(type==='volume')return v<10?'low':v<=100?'moderate':'high';return v<1e6?'low':v<=1e8?'moderate':'high';}
function renderStep2(){
  let h='';
  D.procedures.forEach((p,i)=>{
    h+=`<div class="proc-block"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-weight:500">${t('procedure')} ${i+1}</span>`;
    if(D.procedures.length>1)h+=`<button style="font-size:12px;color:var(--red-text);background:none;border:none;cursor:pointer" onclick="D.procedures.splice(${i},1);render()">${t('remove')}</button>`;
    h+=`</div>`;
    h+=`<div class="field"><label class="field-label">${t('procName')}</label><input type="text" value="${esc(p.name)}" onchange="D.procedures[${i}].name=this.value" placeholder="${t('procPh')}"></div>`;
    h+=radioGroup(t('aerosol'),[{v:'low',l:t('aeroLow')},{v:'moderate',l:t('aeroMod')},{v:'high',l:t('aeroHigh')},{v:'unknown',l:t('aeroUnknown')}],p.aerosol,`D.procedures[${i}].aerosol`,2);
    h+=`<div class="grid2"><div class="field"><label class="field-label">${t('volumeValue')}</label><input type="number" min="0" step="any" value="${esc(p.volumeValue??'')}" onchange="D.procedures[${i}].volumeValue=this.value;render()"></div><div class="field"><label class="field-label">${t('volumeUnit')}</label><select onchange="D.procedures[${i}].volumeUnit=this.value;render()"><option value="mL" ${(p.volumeUnit||'mL')==='mL'?'selected':''}>mL</option><option value="µL" ${p.volumeUnit==='µL'?'selected':''}>µL</option><option value="L" ${p.volumeUnit==='L'?'selected':''}>L</option></select></div></div>`;
    h+=radioGroup(t('volume'),[{v:'low',l:'<10 mL'},{v:'moderate',l:'10–100 mL'},{v:'high',l:'>100 mL'}],p.volume,`D.procedures[${i}].volume`,3);
    if(p.volumeValue!=='' && (p.volumeUnit||'mL')==='mL' && p.volume && expectedNumericCategory(p.volumeValue,'volume')!==p.volume)h+=`<div class="note note-red">${t('categoryMismatch')}</div>`;
    h+=`<div class="grid2"><div class="field"><label class="field-label">${t('concValue')}</label><input type="number" min="0" step="any" value="${esc(p.concentrationValue??'')}" onchange="D.procedures[${i}].concentrationValue=this.value;render()"></div><div class="field"><label class="field-label">${t('concUnit')}</label><input type="text" value="${esc(p.concentrationUnit||'')}" placeholder="PFU/mL, CFU/mL, TCID₅₀/mL…" onchange="D.procedures[${i}].concentrationUnit=this.value;render()"></div></div>`;
    h+=radioGroup(t('conc'),[{v:'low',l:'<10⁶'},{v:'moderate',l:'10⁶–10⁸'},{v:'high',l:'>10⁸'}],p.concentration,`D.procedures[${i}].concentration`,3);

  const decision=getDecision(),bsl=decision.matrixBsl||'—',erg=getTable8Notation(),pause=getPausePoints();
  let h=`<div class="result-big"><div style="font-size:14px;color:var(--text2);margin-bottom:8px">${t('matrixBsl')}</div>
    <div class="bsl">${bsl}</div>

  if(pause.paused)h+=`<div class="note note-red"><b>${t('pauseTitle')}</b><br>${pause.reasons.map(r=>r==='risk_group_not_established'?t('pauseRG'):r==='aerosol_uncharacterized'?t('pauseAerosol'):t('pauseReview')).join('<br>')}</div>`;
  if(erg==='RG3*'&&bsl.includes('BSL-2+'))h+=`<div class="note note-amber">${t('rg3starCond')}</div>`;
  if(decision.matrixCondition==='rg1_moderate_standard_bsl1')h+=`<div class="note note-amber">${t('table8NoteRg1Mod')}</div>`;

// Non-enveloped viruses & spore-formers: ethanol-resistant, need sporicidal/virucidal agents
const RESISTANT_AGENTS=/aav|adeno-?associated|adenoasociad|adenovir|parvovir|norovir|rotavir|enterovir|poliovir|coxsackie|hepatitis a|hav\b|papillomavir|papilomavir|\bhpv\b|\bvph\b|calicivir|reovir|bacillus|anthrac|[áa]ntrax|carbunco|clostrid|difficile|c\.?\s*diff|spore|espora|prion|crypto|cripto/i;
function getDecon(profile){
  const base=(CONTROLS[profile]||CONTROLS['BSL-2']).decon||[];
  const nameHit=RESISTANT_AGENTS.test(D.agentName||'')||RESISTANT_AGENTS.test(D.parentalOrg||'');
  const resistant=D.modFactors.stability==='increase'||nameHit;
  const lead=resistant
    ? p('⚠ Environmentally stable / non-enveloped agent detected: use a validated sporicidal/virucidal disinfectant (≥0.5–1% sodium hypochlorite); plain ethanol is INSUFFICIENT.','⚠ Agente ambientalmente estable / no envuelto detectado: utilice un desinfectante esporicida/virucida validado (hipoclorito sódico ≥0,5–1%); el etanol por sí solo es INSUFICIENTE.')
    : p('Enveloped agent: 70% ethanol or quaternary ammonium adequate; verify against agent safety data sheet.','Agente envuelto: etanol al 70% o amonio cuaternario adecuados; verifique con la ficha de seguridad del agente.');
  return [lead,...base];
}

    sec.body.forEach(b=>{
      if(b.type==='kv') r+='  '+b.k.en+' / '+b.k.es+': '+b.v+'\n';
      else if(b.type==='sub') r+='  '+b.k.en+' / '+b.k.es+':\n';
      else if(b.type==='text') r+=wrap(b.v||'—','  ')+'\n';
      else if(b.type==='note') r+=wrap('⚠ '+b.en,'  ')+'\n'+wrap(b.es,'     ')+'\n';
      else if(b.type==='list'){ if(b.items) b.items.forEach(it=>{r+='  • '+LE(it)+'\n'+wrap((it.es||it.en||''),'      ')+'\n'}); }
      else if(b.type==='factors') b.items.forEach(it=>{r+='  • '+it.label.en+' / '+it.label.es+' → '+it.status.en+' / '+it.status.es+'  ('+it.desc.en+' / '+it.desc.es+')\n'});
      else if(b.type==='procs'){ if(!b.items){r+='  —\n';} else b.items.forEach(it=>{r+='  '+it.n+'. '+it.name+'\n      → '+it.psr+' PSR  ·  Aerosol '+it.aer.en+'/'+it.aer.es+'  ·  Vol '+it.vol.en+'/'+it.vol.es+'  ·  Conc '+it.conc.en+'/'+it.conc.es+'\n'}); }
    });
  });
  r+='\nSIGN-OFF / FIRMAS\n'+'-'.repeat(76)+'\n';
  r+='  Assessor / Evaluador: ____________________________   Date / Fecha: ____________\n\n';
  r+='  Biosafety Officer / Responsable de Bioseguridad: ____________________   Date / Fecha: ____________\n';
  r+='\n'+'='.repeat(76)+'\n';
  r+='Framework reference / Referencia del marco:\n  '+CIT+'\n';
  r+='Regulatory basis / Base regulatoria:\n  '+REGBASIS+'\n';
  r+='\n'+DISC.en+'\n'+DISC.es+'\n';
  r+='https://rafael-67.github.io/psr-tool/\n';
  return r;
}
function wrap(s,ind){s=String(s);const max=72-ind.length;const words=s.split(/\s+/);let line='',out=[];words.forEach(w=>{if((line+' '+w).trim().length>max){out.push(ind+line.trim());line=w;}else line+=' '+w;});if(line.trim())out.push(ind+line.trim());return out.join('\n');}

function reportHTML(M){
  const sec=M.sections.map(s=>{
    let inner='';
    s.body.forEach(b=>{
      if(b.type==='kv') inner+='<div class="row"><div class="k">'+s_(b.k.en)+' <i>/ '+s_(b.k.es)+'</i></div><div class="v">'+esc(b.v)+'</div></div>';
      else if(b.type==='sub') inner+='<h3>'+s_(b.k.en)+' <i>/ '+s_(b.k.es)+'</i></h3>';
      else if(b.type==='text') inner+='<p class="free">'+esc(b.v||'—').replace(/\n/g,'<br>')+'</p>';
      else if(b.type==='note') inner+='<div class="note">'+s_(b.en)+'<br><i>'+s_(b.es)+'</i></div>';
      else if(b.type==='list'){ inner+='<ul>'+((b.items||[]).map(it=>'<li>'+s_(LE(it))+'<br><i>'+s_(it.es||it.en||'')+'</i></li>').join(''))+'</ul>'; }
      else if(b.type==='factors'){ inner+='<table class="fct"><thead><tr><th>Factor</th><th>Status / Estado</th><th>Detail / Detalle</th></tr></thead><tbody>'+b.items.map(it=>'<tr><td>'+s_(it.label.en)+' <i>/ '+s_(it.label.es)+'</i></td><td class="st-'+it.status.en.toLowerCase()+'">'+s_(it.status.en)+' / '+s_(it.status.es)+'</td><td>'+s_(it.desc.en)+' / '+s_(it.desc.es)+'</td></tr>').join('')+'</tbody></table>'; }
      else if(b.type==='procs'){ inner+=b.items?('<table class="prc"><thead><tr><th>#</th><th>Procedure / Procedimiento</th><th>PSR</th><th>Aerosol</th><th>Vol</th><th>Conc</th></tr></thead><tbody>'+b.items.map(it=>'<tr><td>'+it.n+'</td><td>'+esc(it.name)+'</td><td><b>'+it.psr+'</b></td><td>'+s_(it.aer.en)+'/'+s_(it.aer.es)+'</td><td>'+s_(it.vol.en)+'/'+s_(it.vol.es)+'</td><td>'+s_(it.conc.en)+'/'+s_(it.conc.es)+'</td></tr>').join('')+'</tbody></table>'):'<p class="free">—</p>'; }
    });
    return '<section><h2>'+s_(s.title.en)+' <i>/ '+s_(s.title.es)+'</i></h2>'+inner+'</section>';
  }).join('');
  const css='@page{size:A4;margin:18mm 16mm}*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;font-size:11px;line-height:1.5;margin:0}h1{font-size:17px;margin:0 0 2px}h2{font-size:12.5px;color:#534ab7;border-bottom:1.5px solid #534ab7;padding-bottom:2px;margin:14px 0 6px}h3{font-size:11px;margin:8px 0 3px;color:#333}h2 i,h3 i,.k i{font-weight:400;color:#777;font-style:italic}.meta{font-size:10px;color:#666;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:4px}.row{display:flex;gap:8px;padding:1.5px 0}.k{flex:0 0 38%;color:#444}.v{flex:1;font-weight:500}.free{white-space:pre-wrap;background:#f6f6f3;border-left:2px solid #ccc;padding:6px 8px;margin:3px 0}ul{margin:2px 0 6px 16px;padding:0}li{margin:1px 0}li i,.note i,.v i{color:#777;font-style:italic}.note{background:#faf4e8;border-left:2px solid #d8a73a;padding:5px 8px;margin:4px 0}table{width:100%;border-collapse:collapse;margin:4px 0;font-size:10px}th,td{border:1px solid #ddd;padding:3px 5px;text-align:left;vertical-align:top}th{background:#eeedfe;color:#444;font-weight:600}.st-unfavorable{color:#a32d2d;font-weight:600}.st-favorable{color:#3b6d11}.signoff{margin-top:16px;border-top:1px solid #ccc;padding-top:10px}.sigline{margin:14px 0 2px}.sigbox{display:inline-block;border-bottom:1px solid #333;min-width:230px}.footer{margin-top:14px;border-top:2px solid #534ab7;padding-top:6px;font-size:9px;color:#555}.footer b{color:#333}.disc{font-style:italic;margin-top:4px}';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+M.meta.rid+'</title><style>'+css+'</style></head><body onload="window.print()">'
    +'<h1>PSR Biosafety Assessment Report <i style="font-weight:400;color:#777;font-size:12px">/ Informe de evaluación de bioseguridad PSR</i></h1>'
    +'<div class="meta">PSR v'+M.meta.version+' &nbsp;·&nbsp; Report ID: '+M.meta.rid+' &nbsp;·&nbsp; Generated / Generado: '+M.meta.generated+' UTC</div>'
    +sec
    +'<div class="signoff"><div class="sigline">Assessor / Evaluador: <span class="sigbox"></span> &nbsp;&nbsp; Date / Fecha: <span class="sigbox" style="min-width:120px"></span></div>'
    +'<div class="sigline">Biosafety Officer / Responsable de Bioseguridad: <span class="sigbox"></span> &nbsp;&nbsp; Date / Fecha: <span class="sigbox" style="min-width:120px"></span></div></div>'
    +'<div class="footer"><b>Framework reference / Referencia del marco:</b> '+s_(CIT)+'<br><b>Regulatory basis / Base regulatoria:</b> '+s_(REGBASIS)
    +'<div class="disc">'+s_(DISC.en)+'<br>'+s_(DISC.es)+'</div>https://rafael-67.github.io/psr-tool/</div></body></html>';
}
function s_(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function exportReport(){
  if(getPausePoints().paused){alert(t('pauseTitle'));return;}
  if(getEscalationConsideration()&&!String(D.justification||'').trim()){alert(t('justRequired'));step=5;render();return;}
  if(!bsl2ConditionsMet()){alert(t('bsl2ConditionsRequired'));step=5;render();return;}
  const r=reportTXT(reportModel());
  const blob=new Blob([r],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`PSR_Assessment_${(D.agentName||'report').replace(/\s+/g,'_').slice(0,40)}_${D.reviewDate||'undated'}.txt`;
  a.click();URL.revokeObjectURL(a.href);
}
function printReport(){
  if(getPausePoints().paused){alert(t('pauseTitle'));return;}
  if(getEscalationConsideration()&&!String(D.justification||'').trim()){alert(t('justRequired'));step=5;render();return;}
  if(!bsl2ConditionsMet()){alert(t('bsl2ConditionsRequired'));step=5;render();return;}
  const html=reportHTML(reportModel());
  const w=window.open('','_blank');
  if(!w){alert(lang==='es'?'Permita las ventanas emergentes para generar el PDF.':'Please allow pop-ups to generate the PDF.');return;}
  w.document.open();w.document.write(html);w.document.close();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toggleLang(){lang=lang==='en'?'es':'en';localStorage.setItem('psr:lang',lang);document.getElementById('langBtn').textContent=lang==='en'?'ES':'EN';render()}
(function(){var b=document.getElementById('langBtn');if(b)b.textContent=lang==='en'?'ES':'EN';})();

render();
</script>
